name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check backend/
      - run: black --check backend/

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements/dev.txt
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test@localhost/test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-real
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: pytest --cov=apps --cov-report=xml -x -q
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run format:check

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test:ci

  executor-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements/dev.txt
      - name: Build executor image
        run: docker build -t executor-test -f docker/executor/Dockerfile docker/executor/
      - name: Jailbreak test suite
        run: |
          # Test 1: /proc access denied
          result=$(docker run --rm \
            --entrypoint python3 \
            --network none --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --user 65534:65534 \
            executor-test \
            -c "open('/proc/1/environ').read()" 2>&1 || true)
          echo "$result" | grep -qiE "permission denied|no such file" \
            && echo "PASS: /proc blocked" \
            || (echo "FAIL: /proc accessible" && exit 1)

          # Test 2: network blocked (socket syscall)
          result=$(docker run --rm \
            --entrypoint python3 \
            --network none --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --user 65534:65534 \
            executor-test \
            -c "import socket; socket.socket()" 2>&1 || true)
          echo "$result" | grep -qiE "permission denied|operation not permitted|blocked" \
            && echo "PASS: socket blocked" \
            || (echo "FAIL: socket accessible" && exit 1)

          # Test 3: write to /etc blocked
          result=$(docker run --rm \
            --entrypoint python3 \
            --network none --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --user 65534:65534 \
            executor-test \
            -c "open('/etc/pwned','w').write('x')" 2>&1 || true)
          echo "$result" | grep -qiE "read-only|permission denied" \
            && echo "PASS: /etc write blocked" \
            || (echo "FAIL: /etc writable" && exit 1)

          # Test 4: static scanner blocks pip install
          result=$(cd backend && PYTHONPATH=. python3 -c "
          from apps.execution.code_scanner import scan_code
          safe, reason = scan_code('pip install requests', 'python')
          assert not safe, 'Scanner should reject pip install'
          print('PASS: scanner blocked pip install')
          ")
          echo "$result"
