name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint-test:
    name: Backend lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collab_test
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://collab:collab@localhost:5432/collab_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret
      DEBUG: "true"
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Pytest
        run: pytest -v --tb=short

  frontend-lint-test:
    name: Frontend lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src/

      - name: Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,css}"

      - name: Vitest
        run: npx vitest run

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f docker/backend/Dockerfile -t code-collab-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/frontend/Dockerfile -t code-collab-frontend:ci .

      - name: Build executor image
        run: docker build -f docker/executor/Dockerfile -t code-collab-executor:ci .

      # TODO: push to ECR on main branch (Phase 3 hardening)

  executor-jailbreak-tests:
    name: Executor jailbreak tests
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executor image
        run: docker build -f docker/executor/Dockerfile -t code-collab-executor:ci .

      - name: Run jailbreak test suite
        run: bash scripts/test_jailbreak.sh
        env:
          EXECUTOR_IMAGE: code-collab-executor:ci
