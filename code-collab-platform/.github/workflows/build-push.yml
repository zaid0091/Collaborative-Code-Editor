name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/backend/Dockerfile \
            --target production \
            -t $ECR_REGISTRY/collab-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/collab-backend:latest .
          docker push $ECR_REGISTRY/collab-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/collab-backend:latest
      - name: Build and push executor
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/executor/Dockerfile \
            -t $ECR_REGISTRY/collab-executor:$IMAGE_TAG \
            -t $ECR_REGISTRY/collab-executor:latest docker/executor/
          docker push $ECR_REGISTRY/collab-executor:$IMAGE_TAG
          docker push $ECR_REGISTRY/collab-executor:latest
