services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab}
      POSTGRES_DB: ${POSTGRES_DB:-collab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collab} -d ${POSTGRES_DB:-collab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    env_file: .env
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0
      --port 8000
      --reload

  celery-persist:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A tasks worker
      -Q crdt.persist
      -c 2
      --loglevel=info

  celery-exec-high:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      celery -A tasks worker
      -Q execution.high,execution.low
      -c 4
      --prefetch-multiplier=1
      --loglevel=info

  celery-exec-low:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      celery -A tasks worker
      -Q execution.low
      -c 2
      --prefetch-multiplier=1
      --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A tasks beat
      --loglevel=info

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_AWARENESS_THROTTLE_MS: ${VITE_AWARENESS_THROTTLE_MS}
        VITE_CURSOR_RENDER_FPS: ${VITE_CURSOR_RENDER_FPS}
        VITE_UNDO_CAPTURE_TIMEOUT_MS: ${VITE_UNDO_CAPTURE_TIMEOUT_MS}
        VITE_FILE_TIER_OPTIMIZED_BYTES: ${VITE_FILE_TIER_OPTIMIZED_BYTES}
        VITE_FILE_TIER_VIRTUALIZED_BYTES: ${VITE_FILE_TIER_VIRTUALIZED_BYTES}
        VITE_CHUNK_LINE_COUNT: ${VITE_CHUNK_LINE_COUNT}
        VITE_CHUNK_BUFFER_LINES: ${VITE_CHUNK_BUFFER_LINES}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
