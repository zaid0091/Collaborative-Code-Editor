# =============================================================================
# WebSocket gateway — real-time collaboration (/ws/)
#
# Sticky sessions are NOT required for correctness.
# Redis pub/sub (Django Channels channel layer) handles cross-node broadcast;
# any ASGI worker can deliver messages to its local sockets.
#
# ip_hash below is optional soft stickiness — a deploy optimization only to
# reduce reconnect churn during rolling deploys. The system works correctly if
# a client reconnects to a different node (stateless sync_request protocol).
# =============================================================================

# Optional soft stickiness — NOT required for correctness
upstream ws_backend {
    ip_hash;
    server backend:8000;
}

limit_conn_zone $binary_remote_addr zone=ws_conn_zone:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
