# Code Collab Platform — main NGINX configuration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/html text/css application/json application/javascript;

    # Load conf.d in order: api → websocket (zones/maps) → static (server block).
    # Wildcard include is avoided so limit_conn/map zones exist before use.
    include /etc/nginx/conf.d/api.conf;
    include /etc/nginx/conf.d/websocket.conf;
    include /etc/nginx/conf.d/static.conf;
}
